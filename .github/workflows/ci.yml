name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24.x", "1.26.5"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go mod download
      - run: go mod tidy -diff
      - name: Check formatting
        run: make fmt-check
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Build examples
        run: |
          mkdir -p "$RUNNER_TEMP/locker-examples"
          go build -o "$RUNNER_TEMP/locker-examples/" ./examples/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --build-tags=integration ./...

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  integration:
    runs-on: ubuntu-latest
    services:
      redis-a:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6379:6379
      redis-b:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6380:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true
      - run: go test -tags=integration -race ./...
        env:
          LOCKER_REDIS_ADDRS: 127.0.0.1:6379,127.0.0.1:6380
