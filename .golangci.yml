version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - contextcheck
    - durationcheck
    - errorlint
    - misspell
    - nolintlint
    - revive
    - testifylint
    - usestdlibvars
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: error-naming
        - name: context-as-argument
        - name: datarace
        - name: defer
        - name: early-return
        - name: receiver-naming
        - name: time-naming
        - name: var-naming
  exclusions:
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
